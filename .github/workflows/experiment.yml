name: Experiment build (manual)

# Manual only, and no `contents: write` permission: this can never publish a Release,
# regardless of what changes in the build step below. TR+ always includes MPE once MPE is
# on main; until then this builds the same image as the tr-plus target in build.yml. Once
# MPE lands, give this workflow a way to build without it (e.g. a --no-mpe flag) so it keeps
# doing what its name says.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Board'
        type: choice
        options: [tr-plus, tr]
        default: tr-plus
      usb_keyboard:
        description: 'TeensyROM + USB keyboard build (--usb-keyboard, docs/USB_Keyboard.md)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install arduino-cli
        run: |
          CLI=$(node tools/install-arduino-cli.mjs)
          echo "Resolved arduino-cli: $CLI"
          if [ "$CLI" != "arduino-cli" ]; then
            dirname "$CLI" >> "$GITHUB_PATH"
          fi

      - name: Install Teensy core 1.61.0
        shell: bash
        run: |
          arduino-cli config init --additional-urls https://www.pjrc.com/teensy/package_teensy_index.json
          arduino-cli core update-index
          arduino-cli core install teensy:avr@1.61.0
          arduino-cli lib install CRC32@2.0.1

      - name: Build ${{ inputs.target }} (experimental)
        env:
          TARGET: ${{ inputs.target }}
          USB_KEYBOARD: ${{ inputs.usb_keyboard }}
        run: |
          ARGS=(--target "$TARGET")
          if [ "$USB_KEYBOARD" = "true" ]; then ARGS+=(--usb-keyboard); fi
          node tools/build-firmware.mjs "${ARGS[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.target }}-experiment${{ inputs.usb_keyboard && '-usbkbd' || '' }}
          path: build/firmware/*.hex
